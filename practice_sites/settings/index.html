<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Practice Settings</title>
  <style>
    body { font-family: Tahoma, sans-serif; background: white; }
    main { max-width: 620px; margin: 30px auto; }
    .row { display: flex; justify-content: space-between; align-items: center;
           border-bottom: 1px solid #ddd; padding: 18px 4px; }
    select { padding: 6px 16px; }
    button { float: right; margin-top: 24px; padding: 10px 30px;
             background: #1d4ed8; color: white; border: 0; }
  </style>
  <script src="../shared/faults.js"></script>
</head>
<body>
  <main>
    <h1>Preferences</h1>
    <div class="row"><label for="notify">Email notifications</label>
      <input id="notify" type="checkbox"></div>
    <div class="row"><label for="theme">Theme</label>
      <select id="theme"><option>Light</option><option>Dark</option><option>System</option></select></div>
    <div class="row"><label for="nickname">Display name</label>
      <input id="nickname" autocomplete="off"></div>
    <button id="save-button" type="button">Save changes</button>
    <p id="status"></p>
  </main>
  <script>
    document.getElementById("save-button").addEventListener("click", () => {
      runMainAction(() => {
        document.getElementById("status").textContent = "Settings saved";
      });
    });
  </script>
</body>
</html>
